input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  if [log] {
    mutate {
      rename => { "log" => "message" }
    }
  }

  json {
    source => "message"
    tag_on_failure => ["_jsonparsefailure"]
  }

  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
  }
}
