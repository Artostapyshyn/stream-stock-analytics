server:
  port: 9003

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: user-service
  cloud:
    config:
      enabled: true
      uri: http://config-server:8101
      fail-fast: true
eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-server:8001/eureka/